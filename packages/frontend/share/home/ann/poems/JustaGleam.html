<p>&nbsp;
<p>
            <center>
                <font size="+2" color=red>
                    Just a Gleam
                </font>
            </center>
            <blockquote>
                <p>
                <p>
                <p>
                Sometimes our most dearest dreams<br>
                Only occur in reality as gleams<br>
                Of the radiant Risen Son's Light<br>
                Shining ever so sparkling bright!<br>
                <p>
                <p>
            </blockquote>
