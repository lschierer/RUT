        <font face="Arial,Geneva,Helvetica">
<p>&nbsp;
<p>
            <center>
                <font size="+2" color=red>
                    A Deadly Fall
                </font>
            </center>
            <blockquote>
                <p>
                <p>
                Suicide is a deady fall<br>
                After an unanswered call!<br>
                Suicide is a fatal choice<br>
                An inability to hear God's voice!<br>
                Suicide is so tragically sad<br>
                It only makes the evil one glad!<br>
                <p>
            </blockquote>
