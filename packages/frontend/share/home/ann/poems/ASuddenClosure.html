        <font face="Arial,Geneva,Helvetica">
<p>&nbsp;
<p>
            <center>
                <font size="+2" color=red>
                    A Sudden Closure
                </font>
            </center>
            <blockquote>
                <p>
                When an open door suddenly closes<br>
                On cherished, sought after dreams<br>
                The heart is cut open and ripped out<br>
                In grievous pain, the soul screams!<br>
                <p>
            </blockquote>
