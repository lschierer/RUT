# PAGI WebServer Framework Configuration
# cspell: disable
# Stage: localDev, staging, production
stage: production

modules:
  "^WebFramework::Module::AutoIndex": {}
  "^WebFramework::Module::Navigation": {}
  "^WebFramework::Module::SiteLogo": {}
#    site_logo: public/images/LukeHPSite.svg
  Template:
    paths:
      - templates
      - templates/partials
      - ../PAGI-WebServer/templates
      - ../PAGI-WebServer/templates/partials
    conf:
      EVAL_PERL: 1
# Server configuration
server:
  host: 0.0.0.0
  port: 3004
  worker_threads: 4

# Directory paths
css_dir: styles
typescript_dir: src
markdown_dir: share/pages
luke_content_dir: packages/luke
ann_content_dir: packages/ann
archives_dir: packages/archives
archives_extracted_dir: packages/archives/extracted

log_base: Schierer-Org
site_url: dev.schierer.org
log_config:
  default: INFO
  'Schierer::Org': DEBUG
  'WebFramework': DEBUG